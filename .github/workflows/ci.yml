name: CI

# Push-to-main only. No PR-triggered runs per user preference — Vercel
# preview deploys + PR-time lint gating are explicitly out of scope.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pinned to match `packageManager` in root package.json.
          version: 10.29.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint runs but doesn't fail CI yet — 5 pre-existing
      # `react-hooks/set-state-in-effect` errors in apps/dashboard/src/hooks/*
      # need a structural refactor (move to SWR/TanStack Query or restructure
      # useEffect calls). Tracked as follow-up; lint failures are visible in
      # the run output for visibility without blocking deploys.
      - name: Lint (warn-only)
        run: pnpm lint
        continue-on-error: true

      # Hard gate: any tsc error fails the build.
      - name: Type-check (dashboard)
        run: pnpm --filter @open-embed-ui/dashboard exec tsc --noEmit

      # Mirror exactly what Vercel runs for the dashboard deploy (see
      # `vercel.json` buildCommand). The widget bundle goes into
      # apps/dashboard/public/widget.js as part of `build:widget`, and the
      # 19 KB gz budget is enforced by scripts/check-bundle-size.mjs.
      # Skip the other workspace packages — preview ships separately and
      # embed-api is verified by its own deploy workflow (wrangler bundles
      # the worker, so a plain build step adds nothing).
      - name: Build widget
        run: pnpm build:widget

      - name: Build dashboard (mirror Vercel buildCommand)
        run: pnpm --filter @open-embed-ui/dashboard build
